# CMS 前端静态站点 + API 反代
# 安装：sudo cp cms-front.conf /etc/nginx/conf.d/ && sudo nginx -t && sudo systemctl reload nginx
#
# DNS（阿里云解析，与 @ / www 同一台机）：
#   admin  A  47.97.164.209
#   docs   A  47.97.164.209
#
# 管理端：http://cms-admin.cyrus-yc.top/
# Docs：  http://cms-docs.cyrus-yc.top/
# API 由 Nginx 反代到本机 Spring Boot（/api → 127.0.0.1:8080）

upstream cms_backend {
    server 127.0.0.1:8080;
    keepalive 32;
}

# ---------- Admin 管理端 ----------
server {
    listen 80;
    server_name cms-admin.cyrus-yc.top;

    root /opt/cms-front/admin;
    index index.html;

    client_max_body_size 10m;

    location /api/ {
        proxy_pass http://cms_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 10s;
        proxy_read_timeout 60s;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff2?)$ {
        expires 7d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }
}

# ---------- Docs shopchup ----------
server {
    listen 80;
    server_name cms-docs.cyrus-yc.top;

    root /opt/cms-front/docs-shopchup;
    index docs.html;

    client_max_body_size 10m;

    location /api/ {
        proxy_pass http://cms_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 10s;
        proxy_read_timeout 60s;
    }

    location / {
        try_files $uri $uri/ /docs.html;
    }

    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff2?)$ {
        expires 7d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }
}
