# CMS 前端静态站点 + API 反代
# 安装：sudo cp cms-front.conf /etc/nginx/conf.d/ && sudo nginx -t && sudo systemctl reload nginx
#
# 管理端：http://<公网IP>/
# Docs(shopchup)：http://<公网IP>:8081/
# API 由 Nginx 反代到本机 Spring Boot，浏览器同源访问 /api，无需改 CORS

upstream cms_backend {
    server 127.0.0.1:8080;
    keepalive 32;
}

# ---------- Admin 管理端（80）----------
server {
    listen 80;
    server_name _;

    root /opt/cms-front/admin;
    index index.html;

    client_max_body_size 10m;

    location /api/ {
        proxy_pass http://cms_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 10s;
        proxy_read_timeout 60s;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff2?)$ {
        expires 7d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }
}

# ---------- Docs shopchup 只读站（8081）----------
server {
    listen 8081;
    server_name _;

    root /opt/cms-front/docs-shopchup;
    index docs.html;

    client_max_body_size 10m;

    location /api/ {
        proxy_pass http://cms_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 10s;
        proxy_read_timeout 60s;
    }

    location / {
        try_files $uri $uri/ /docs.html;
    }

    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff2?)$ {
        expires 7d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }
}
