# 生产：迁移走 CI/CD 或 mvn liquibase:update，应用启动不再自动跑
spring:
  liquibase:
    enabled: false

logging:
  level:
    root: INFO
    com.cms: INFO
    com.baomidou.mybatisplus: WARN

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      show-details: when-authorized


cms:
  media-cleanup:
    orphan-ready-after-days: 7
    dry-run: false