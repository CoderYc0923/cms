spring:
  application:
    name: cms-back-admin
  datasource:
    url: jdbc:mysql://${DB_HOST:127.0.0.1}:${DB_PORT:3307}/${DB_NAME:cms}?useUnicode=true&characterEncoding=utf-8&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&useSSL=false
    username: ${DB_USERNAME:cms}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
  liquibase:
    enabled: true
    change-log: classpath:db/changelog/db.changelog-master.yaml
  data:
    redis:
      host: ${REDIS_HOST:127.0.0.1}
      port: ${REDIS_PORT:6379}
      database: 0
      timeout: 3s
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 5MB

logging:
  level: # 日志级别
    root: INFO # 根级别
    com.cms: INFO # 包名

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus # 暴露的端点
  endpoint:
    health:
      show-details: when-authorized # 健康检查时显示详细信息
  metrics:
    tags:
      application: ${spring.application.name} # 应用名称

mybatis-plus:
  mapper-locations: classpath*:/mapper/**/*.xml # 有 XML 时用；纯注解可省略
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    db-config:
      id-type: auto

security:
  jwt-secret: ${CMS_JWT_SECRET:please-change-me-to-a-very-long-secret-key-32bytes}
  access-token-ttl: 30m
  refresh-token-ttl: 7d
