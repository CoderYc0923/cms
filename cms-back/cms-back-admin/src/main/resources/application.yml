spring:
  application:
    name: cms-back-admin
  datasource:
    url: jdbc:mysql://${DB_HOST:127.0.0.1}:${DB_PORT:3307}/${DB_NAME:cms}?useUnicode=true&characterEncoding=utf-8&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&useSSL=false
    username: ${DB_USERNAME:cms}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
  liquibase:
    enabled: true
    change-log: classpath:db/changelog/db.changelog-master.yaml
  data:
    redis:
      host: ${REDIS_HOST:127.0.0.1}
      port: ${REDIS_PORT:6379}
      database: 0
      timeout: 3s
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 5MB

logging:
  level: # 日志级别
    root: INFO # 根级别
    com.cms: INFO # 包名

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus # 暴露的端点
  endpoint:
    health:
      show-details: when-authorized # 健康检查时显示详细信息
  metrics:
    tags:
      application: ${spring.application.name} # 应用名称

mybatis-plus:
  mapper-locations: classpath*:/mapper/**/*.xml # 有 XML 时用；纯注解可省略
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    db-config:
      id-type: auto

security:
  jwt-secret: ${CMS_JWT_SECRET:please-change-me-to-a-very-long-secret-key-32bytes}
  access-token-ttl: 30m
  refresh-token-ttl: 7d

rocketmq:
  name-server: ${ROCKETMQ_NAME_SERVER:127.0.0.1:9876}
  producer:
    group: ${ROCKETMQ_PRODUCER_GROUP:cms-back-admin-producer}

oss:
  endpoint: ${OSS_ENDPOINT} # 阿里云OSS的访问域名
  bucket: ${OSS_BUCKET}
  access-key-id: ${OSS_ACCESS_KEY_ID}
  access-key-secret: ${OSS_ACCESS_KEY_SECRET}
  signed-get-expire-seconds: 600 # 10分钟
  signed-put-expire-seconds: 3600 # 1小时
  multipart-threshold-bytes: 10485760 # 10MB
  multipart-part-size-bytes: 8388608 # 8MB
  max-image-bytes: 10485760 # 10MB
  max-video-bytes: 524288000 # 500M
  allowed-image-types: image/jpeg,image/png,image/gif,image/webp
  allowed-video-types: video/mp4,video/webm
