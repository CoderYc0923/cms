services:
  redis:
    image: redis:7.2
    container_name: cms-redis
    restart: unless-stopped
    ports:
      - "${REDIS_PORT:-6379}:6379"
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - cms-back-redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  db:
    image: mysql:8.0
    container_name: cms-mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
    ports:
      - "${MYSQL_PORT:-3307}:3306"
    volumes:
      - cms-back-db:/var/lib/mysql
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 10

  rocketmq-namesrv:
    image: apache/rocketmq:${ROCKETMQ_IMAGE_TAG:-5.1.4}
    container_name: cms-rocketmq-namesrv
    restart: unless-stopped
    ports:
      - "${ROCKETMQ_NAMESRV_PORT:-9876}:9876"
    environment:
      JAVA_OPT_EXT: ${ROCKETMQ_NAMESRV_JAVA_OPT:--Xms512m -Xmx512m}
    command: ["sh", "mqnamesrv"]
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'echo > /dev/tcp/127.0.0.1/9876'"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
  
  rocketmq-broker:
    image: apache/rocketmq:${ROCKETMQ_IMAGE_TAG:-5.1.4}
    container_name: cms-rocketmq-broker
    restart: unless-stopped
    depends_on:
      rocketmq-namesrv:
        condition: service_started
    ports:
      - "${ROCKETMQ_BROKER_PORT: -10911}:10911" # 主节点端口
      - "${ROCKETMQ_BROKER_HA_PORT: -10912}:10912" # 主节点HA端口
      - "${ROCKETMQ_BROKER_VIP_PORT: -10909}:10909" # 主节点VIP端口
    environment:
      NAMESRV_ADDR: rocketmq-namesrv:9876
      JAVA_OPT_EXT: ${ROCKETMQ_BROKER_JAVA_OPT:--Xms512m -Xmx512m}
    volumes:
      - cms-back-rocketmq-store:/home/rocketmq/store
      - cms-back-rocketmq-logs:/home/rocketmq/logs
      - ./deploy/rocketmq/broker-local.conf:/home/rocketmq/conf/broker.conf:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"
    command: ["sh", "mqbroker", "-n", "rocketmq-namesrv:9876", "-c", "/home/rocketmq/conf/broker.conf"] # 启动broker
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'echo > /dev/tcp/127.0.0.1/10911'"]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 30s # 启动延迟时间

volumes:
  cms-back-redis:
  cms-back-db:
  cms-back-rocketmq-store:
  cms-back-rocketmq-logs:
