name: Deploy Backend

on:
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Build jar
        working-directory: cms-back
        run: |
          mvn -B clean package -pl cms-back-admin -am -DskipTests
          cp cms-back-admin/target/cms-back-admin-0.0.1-SNAPSHOT.jar "$GITHUB_WORKSPACE/cms-back-admin.jar"

      - name: Upload jar
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: ${{ secrets.DEPLOY_PORT || 22 }}
          source: cms-back-admin.jar
          target: /tmp/cms-back-deploy/
          overwrite: true

      - name: Stop, replace, start
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: ${{ secrets.DEPLOY_PORT || 22 }}
          command_timeout: 15m
          script: |
            set -e
            test -f /tmp/cms-back-deploy/cms-back-admin.jar
            systemctl stop cms-back
            mv -f /tmp/cms-back-deploy/cms-back-admin.jar /opt/cms-back/cms-back-admin.jar
            systemctl start cms-back
            for i in $(seq 1 36); do
              if curl -sf --max-time 3 http://127.0.0.1:8080/actuator/health; then
                echo "health ok"
                exit 0
              fi
              sleep 5
            done
            systemctl status cms-back --no-pager -l || true
            tail -n 50 /opt/cms-back/logs/app.log || true
            exit 1
