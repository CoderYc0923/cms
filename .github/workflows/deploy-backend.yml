name: Deploy Backend

on:
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Build jar
        working-directory: cms-back
        run: mvn clean package -pl cms-back-admin -am -DskipTests

      # 先传到 /tmp，避免覆盖正在运行的 jar 导致文件损坏
      - name: Upload jar to /tmp
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: ${{ secrets.DEPLOY_PORT || 22 }}
          source: cms-back/cms-back-admin/target/cms-back-admin-0.0.1-SNAPSHOT.jar
          target: /tmp/cms-back-deploy/
          strip_components: 3
          overwrite: true

      - name: Install jar & restart
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: ${{ secrets.DEPLOY_PORT || 22 }}
          script: |
            set -e
            JAR_SRC=/tmp/cms-back-deploy/cms-back-admin-0.0.1-SNAPSHOT.jar
            JAR_DST=/opt/cms-back/cms-back-admin-0.0.1-SNAPSHOT.jar
            test -f "$JAR_SRC"
            # 校验 zip 完整性，避免半截 jar 启动
            unzip -t "$JAR_SRC" >/dev/null
            systemctl stop cms-back || true
            mv -f "$JAR_SRC" "$JAR_DST"
            ln -sfn cms-back-admin-0.0.1-SNAPSHOT.jar /opt/cms-back/cms-back-admin.jar
            systemctl start cms-back
            # 轻量机启动较慢，最多等约 90 秒
            for i in $(seq 1 18); do
              if curl -sf http://127.0.0.1:8080/actuator/health; then
                echo "health ok"
                exit 0
              fi
              sleep 5
            done
            echo "health check failed; recent log:"
            tail -n 40 /opt/cms-back/logs/app.log || true
            systemctl status cms-back --no-pager -l || true
            exit 1
