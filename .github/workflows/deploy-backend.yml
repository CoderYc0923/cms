name: Deploy Backend

on:
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Build jar
        working-directory: cms-back
        run: mvn clean package -pl cms-back-admin -am -DskipTests

      - name: Upload jar
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: ${{ secrets.DEPLOY_PORT || 22 }}
          # strip cms-back/cms-back-admin/target → 落到 /opt/cms-back/*.jar
          source: cms-back/cms-back-admin/target/cms-back-admin-0.0.1-SNAPSHOT.jar
          target: /opt/cms-back/
          strip_components: 3
          overwrite: true

      - name: Restart service
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: ${{ secrets.DEPLOY_PORT || 22 }}
          script: |
            set -e
            cd /opt/cms-back
            ln -sf cms-back-admin-0.0.1-SNAPSHOT.jar cms-back-admin.jar
            systemctl restart cms-back
            sleep 8
            curl -sf http://127.0.0.1:8080/actuator/health
